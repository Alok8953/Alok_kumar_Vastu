services:
  - type: web
    name: vastu-website
    runtime: docker
    dockerfilePath: infra/docker/production.Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: FRONTEND_ORIGIN
        value: https://vastualok.com
      - key: BACKEND_PUBLIC_URL
        value: https://vastualok.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: TO_EMAIL
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vastu-db
          property: connectionString

databases:
  - name: vastu-db
    plan: basic-256mb
